mixed:
  # 横向穿越
  - {start: [1.0, 2.5, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: trigger}
  # 迎面行人
  - {start: [-2.5, -3.0, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 6.0, mode: loop}
  # 背后超越/同向
  - {start: [0.0, -4.5, 0.0], vel: [0.3, 0.0, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: loop}

crossing:
  - {start: [1.0, 2.5, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: trigger}

headon:
  - {start: [-2.5, -3.0, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 6.0, mode: loop}

overtake:
  - {start: [0.0, -4.5, 0.0], vel: [0.3, 0.0, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: loop}
